name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows is not incidental here: the service, the installers and the
      # owner's TWS all run there, so a path bug that only shows up on Windows
      # is a bug in production. Don't collapse this to ubuntu-only.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Byte-compile every module
        # Most of examples/ and the backtest runners are entry-point scripts
        # that no test imports, so this is the only thing standing between a
        # syntax error there and someone finding it at the trading desk.
        run: python -m compileall -q paths.py ibkr strategy backtest examples service tests

      - name: Run tests
        run: python -m pytest tests/ -q

  no-broker-deps:
    name: cache layer imports without ib_async
    runs-on: ubuntu-latest

    # ibkr/__init__.py exports IBKRClient lazily so that reading a JSON bar
    # cache does not drag in a broker API library. That is easy to undo by
    # accident -- one eager `from .client import ...` at the top of a module
    # and the backtests silently require TWS to be installed. This job
    # installs pandas but NOT ib_async, so such a change fails here.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install data deps only, deliberately excluding ib_async
        run: pip install pandas numpy pytest

      - name: Confirm ib_async really is absent
        run: |
          python - <<'EOF'
          import importlib.util, sys
          if importlib.util.find_spec("ib_async") is not None:
              sys.exit("ib_async is installed -- this job proves nothing unless it is absent")
          print("ib_async absent, as required")
          EOF

      - name: Import the broker-free modules
        run: python -c "import paths, ibkr.cache; print(paths.data_dir())"

      - name: Run the tests that must not need a broker library
        run: python -m pytest tests/test_bar_cache.py tests/test_paths.py -q
