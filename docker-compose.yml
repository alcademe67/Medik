# Two services from one image: the trading engine and the read-only
# dashboard. Both auto-restart on crash or server reboot. Secrets come
# from your .env file (never baked into the image).
#
#   docker compose up -d        # start both, detached
#   docker compose logs -f engine
#
# The engine trades LIVE only if LIVE_TRADING=true in .env AND you have run
# `python -m bot.golive` (its token file is persisted in ./data).

services:
  engine:
    build: .
    command: python -m bot.live_engine
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data          # persist SQLite state + go-live token
    environment:
      STATE_DB_PATH: /app/data/bot_state.sqlite3
      GOLIVE_TOKEN_PATH: /app/data/.golive_confirmed
      DASHBOARD_ENABLED: "false"   # the separate dashboard service below serves the UI
    healthcheck:
      test: ["CMD", "python", "-c", "import bot.config"]
      interval: 1m
      timeout: 10s
      retries: 3

  dashboard:
    build: .
    # The dashboard is now a stdlib server (bot/dashboard.py). Run standalone
    # here; inside this isolated container it binds 0.0.0.0 so the mapped port
    # works. (When you run the engine directly it also hosts the dashboard
    # in-process on localhost — no separate service needed.)
    command: python -m bot.dashboard
    env_file: .env
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
    environment:
      STATE_DB_PATH: /app/data/bot_state.sqlite3
      GOLIVE_TOKEN_PATH: /app/data/.golive_confirmed
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8787"
      DASHBOARD_OPEN_BROWSER: "false"   # headless container — no browser to open
